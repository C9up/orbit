[workspace]
resolver = "2"
members = ["crates/orbit-host"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/C9up/orbit"

# The host is linked into the app's native library (a static library behind a
# C ABI, called from the JSI module). No `panic = "abort"`: every exported
# function wraps its body in `catch_unwind`, and abort would kill the app.
# `catch_unwind` stops panics only: a stack overflow is not one and ends the
# app whatever this says. The layout recurses once per level of the tree, so
# the host refuses a tree deeper than `MAX_DEPTH` (crates/orbit-host/src/lib.rs)
# before it lays it out.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
